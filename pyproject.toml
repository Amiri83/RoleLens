[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-rolelens"
# Single source of truth for the version; rolelens.__version__ reads the installed metadata.
version = "0.1.0"
description = "Local web app to explore, graph and safely redesign AWS IAM roles (read-only)"
readme = "README.md"
authors = [{ name = "Amir Amiri" }]
requires-python = ">=3.11"
keywords = ["aws", "iam", "roles", "policy", "terraform", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "flask>=3.0",
    "boto3>=1.34",
    "cryptography>=42",
    "openpyxl>=3.1",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[iam,sts]>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Amiri83/RoleLens"
Source = "https://github.com/Amiri83/RoleLens"
Issues = "https://github.com/Amiri83/RoleLens/issues"

[project.scripts]
rolelens = "rolelens.cli:main"

[tool.setuptools.packages.find]
include = ["rolelens*"]

[tool.setuptools.package-data]
rolelens = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# S314: tests parse the SVG / draw.io XML that RoleLens itself generated.
"tests/*" = ["S105", "S106", "S314"]
